name: Parrot
options:
  bundleIdPrefix: com.uygar
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  minimumXcodeGenVersion: "2.30.0"

packages:
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit.git
    exactVersion: "0.18.0"
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    exactVersion: "0.17.3"
  # Vendored SpeexDSP for acoustic echo cancellation (mic + system-audio reference).
  CSpeexDSP:
    path: Vendor/CSpeexDSP

targets:
  Parrot:
    type: application
    platform: macOS
    sources:
      - path: Parrot
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.uygar.parrot
        PRODUCT_NAME: Parrot
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: Parrot/Info.plist
        CODE_SIGN_ENTITLEMENTS: Parrot/Parrot.entitlements
        CODE_SIGN_STYLE: Automatic
        # Sign with a stable identity instead of ad-hoc. macOS keys Screen
        # Recording / mic permission to the app's signing identity; ad-hoc signing
        # changes the code hash on every build, so the OS forgets the grant and
        # re-prompts each time. A real team keeps the identity constant, so
        # permission granted once persists across rebuilds (and for real users).
        DEVELOPMENT_TEAM: "5C2PL8729F"
        SWIFT_VERSION: "5.10"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        GENERATE_INFOPLIST_FILE: false
        ENABLE_HARDENED_RUNTIME: true
        # App icon lives in Parrot/Assets.xcassets/AppIcon.appiconset.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: WhisperKit
        product: WhisperKit
      - package: FluidAudio
        product: FluidAudio
      - package: CSpeexDSP
        product: CSpeexDSP
    postBuildScripts:
      - name: Embed and sign local Qwen runtime
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          source_runtime="${LLAMA_SERVER_SOURCE:-${SRCROOT}/Vendor/QwenRuntime/llama-server}"
          if [ ! -x "$source_runtime" ]; then
            echo "error: llama-server is required at $source_runtime (or set LLAMA_SERVER_SOURCE)"
            exit 1
          fi
          expected_sha256="3210cf12144596addf1e39c5b2bc1bb70cd436d619d15d9deb7622660e329896"
          actual_sha256="$(/usr/bin/shasum -a 256 "$source_runtime" | /usr/bin/awk '{print $1}')"
          if [ "$actual_sha256" != "$expected_sha256" ]; then
            echo "error: llama-server checksum mismatch; refusing to embed an unknown executable"
            exit 1
          fi
          destination_dir="${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Helpers/bin"
          destination="$destination_dir/llama-server"
          /bin/mkdir -p "$destination_dir"
          /usr/bin/ditto "$source_runtime" "$destination"
          /bin/chmod 755 "$destination"
          signing_identity="${EXPANDED_CODE_SIGN_IDENTITY:--}"
          /usr/bin/codesign --force --sign "$signing_identity" --options runtime --timestamp=none \
            --entitlements "${SRCROOT}/Parrot/QwenHelper.entitlements" "$destination"
          asr_source="${ASR_WORKER_SOURCE:-${SRCROOT}/Tools/ASRWorker/Build/portable}"
          if [ ! -x "$asr_source/ParrotASRWorker" ] || [ ! -f "$asr_source/mlx.metallib" ]; then
            echo "error: build the pinned native ASR worker before building Parrot"
            exit 1
          fi
          asr_legacy="${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Helpers/ASRWorker"
          /bin/rm -rf "$asr_legacy"
          asr_destination="${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Helpers/ASRWorker.app"
          /bin/mkdir -p "$asr_destination/Contents/MacOS" "$asr_destination/Contents/Resources"
          /usr/bin/ditto "$asr_source/ParrotASRWorker" "$asr_destination/Contents/MacOS/ParrotASRWorker"
          /usr/bin/ditto "$asr_source/mlx.metallib" "$asr_destination/Contents/Resources/mlx.metallib"
          for asr_resource in "$asr_source"/*.bundle; do
            [ -d "$asr_resource" ] || continue
            /usr/bin/ditto "$asr_resource" "$asr_destination/Contents/Resources/$(/usr/bin/basename "$asr_resource")"
          done
          /usr/bin/python3 - "$asr_destination/Contents/Info.plist" <<'PYINFO'
          import plistlib, sys
          with open(sys.argv[1], "wb") as output:
              plistlib.dump({"CFBundleExecutable": "ParrotASRWorker", "CFBundleIdentifier": "com.uygar.parrot.asr-worker", "CFBundleName": "Parrot ASR Worker", "CFBundlePackageType": "APPL", "CFBundleVersion": "1", "LSBackgroundOnly": True, "LSMinimumSystemVersion": "14.0"}, output)
          PYINFO
          /usr/bin/codesign --force --sign "$signing_identity" --options runtime --timestamp=none \
            --entitlements "${SRCROOT}/Parrot/QwenHelper.entitlements" "$asr_destination"
    entitlements:
      path: Parrot/Parrot.entitlements
      properties:
        # Sandbox + the microphone entitlements. Without audio-input (and, on
        # recent macOS, microphone) a sandboxed app cannot access the mic AT ALL
        # and never appears in Privacy → Microphone. These MUST live here as
        # properties — xcodegen overwrites Parrot.entitlements on every generate,
        # so an external file would be wiped.
        com.apple.security.app-sandbox: true
        com.apple.security.device.audio-input: true
        com.apple.security.device.microphone: true
        # Outbound HTTPS is retained only for first-time local model downloads.
        # PersonalBuildPolicy prevents call audio/text from using cloud providers.
        com.apple.security.network.client: true
        # The on-demand local Qwen worker binds only to 127.0.0.1 and is
        # terminated as soon as title generation finishes.
        com.apple.security.network.server: true
        # User-picked files (knowledge base imports, audio import) + Downloads.
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.downloads.read-write: true
    info:
      path: Parrot/Info.plist
      properties:
        # REQUIRED for mic access: without this string macOS crashes the app on
        # first mic use and never shows it in Privacy → Microphone. Must live here
        # because xcodegen regenerates Info.plist on every generate.
        NSMicrophoneUsageDescription: "Parrot records your microphone so it can transcribe your side of the meeting on-device."
        # Shown when macOS asks for Screen Recording, which Parrot uses to capture
        # system audio via ScreenCaptureKit. Also lives here so xcodegen keeps it.
        NSScreenCaptureUsageDescription: "Parrot captures system audio from your meetings via screen recording. Only audio is used — never screen content."
        # Points Finder/Dock at the asset-catalog icon (asset compiler doesn't
        # inject this when the Info.plist is static).
        CFBundleIconName: AppIcon
        # Start as a menu-bar app even when macOS launches Parrot without opening
        # a SwiftUI window. The in-app preference can still switch to `.regular`
        # at runtime to restore the Dock icon.
        LSUIElement: true

  ParrotTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Tests/ParrotTests
    dependencies:
      - target: Parrot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.uygar.parrot.tests
        GENERATE_INFOPLIST_FILE: true
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "5C2PL8729F"
        SWIFT_VERSION: "5.10"
